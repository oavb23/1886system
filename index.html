<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe completo — Sistema da Oficina</title>
<style>
  :root{--bg:#f2f2f2;--line:#bdbdbd;--mid:#9e9e9e;--dark:#555;--ink:#222;--white:#fff;--note:#fff6c9;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .ph{background:#e0e0e0;border:1px dashed var(--mid);display:flex;align-items:center;justify-content:center;color:var(--dark);font-size:12px;text-align:center}
  .box{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:14px}
  .btn{display:inline-block;border:1px solid var(--dark);background:var(--dark);color:#fff;padding:7px 12px;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn.sec{background:#fff;color:var(--dark)}
  .input{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:4px;color:var(--mid);font-size:13px}
  .badge{display:inline-block;border:1px solid var(--mid);border-radius:10px;padding:2px 8px;font-size:11px;background:#eee;white-space:nowrap}
  .note{background:var(--note);border:1px solid #e6d77a;border-radius:4px;padding:8px 10px;font-size:12px;line-height:1.45}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px;vertical-align:1px}
  .tag.mvp{background:#222;color:#fff}.tag.v2{background:#fff;border:1px solid #999;color:#666}
  h1{font-size:20px;font-weight:600}
  h2{font-size:14px;font-weight:600;margin-bottom:10px}
  .sub{font-size:12px;color:var(--dark)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #e3e3e3}
  th{background:#e8e8e8;font-weight:600;font-size:12px;white-space:nowrap}
  .scroll{overflow-x:auto}
  .page{display:none}.page.on{display:block}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  .side{background:#3a3a3a;color:#ddd;padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .logo{display:flex;gap:8px;align-items:center;margin-bottom:14px;cursor:pointer}
  .logo .ph{width:32px;height:32px;background:#666;border-color:#888;color:#ddd}
  .navi{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:4px;cursor:pointer;margin-bottom:1px;font-size:13px}
  .navi:hover{background:#4a4a4a}.navi.on{background:#888;color:#fff}
  .navi .n{font-size:10px;background:#666;border-radius:8px;padding:0 6px}
  .navgroup{font-size:11px;color:#999;margin:12px 10px 4px}
  .main{display:flex;flex-direction:column;min-width:0}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:3}
  .top .input{flex:1;max-width:380px}
  .top .r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .content{padding:20px;display:flex;flex-direction:column;gap:16px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .kpi .v{font-size:22px;font-weight:700;margin-top:6px}.kpi .l{font-size:12px;color:var(--dark)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .acts{display:flex;gap:4px}
  .ico{min-width:26px;height:26px;padding:0 5px;border:1px solid var(--line);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--dark);background:#fff;cursor:pointer}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form label{font-size:12px;color:var(--dark);display:block;margin-bottom:4px}
  .form .input{width:100%}
  .full{grid-column:1/-1}
  .steps{display:flex;gap:6px;flex-wrap:wrap}
  .steps span{border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:14px;font-size:12px}
  .steps span.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .totals{display:flex;justify-content:flex-end;gap:24px;padding-top:10px}
  .bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding:10px;border-bottom:1px solid var(--line)}
  .bars div{flex:1;background:#bbb;border-radius:3px 3px 0 0}
  .bars div:nth-child(2n){background:#8f8f8f}
  .blabels{display:flex;gap:10px;padding:4px 10px;font-size:11px;color:var(--dark)}.blabels span{flex:1;text-align:center}
  .alert{border:1px solid var(--line);border-left:4px solid var(--dark);border-radius:4px;padding:8px 10px;margin-bottom:8px;font-size:13px}
  .alert small{display:block;color:var(--dark);font-size:11px}
  .feed div{padding:7px 0;border-bottom:1px solid #eee;font-size:13px}.feed small{color:var(--mid);font-size:11px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal div{background:#fff;border:1px solid #e3e3e3;border-radius:3px;min-height:62px;padding:4px;font-size:11px;color:var(--dark)}
  .cal .h{min-height:auto;background:#e8e8e8;text-align:center;font-weight:600}
  .cal .ev{display:block;background:#ddd;border-radius:2px;padding:1px 3px;margin-top:3px;color:var(--ink)}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col{background:#e8e8e8;border-radius:6px;padding:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px;margin-top:8px;font-size:13px}
  .card small{display:block;color:var(--dark);font-size:11px;margin-top:3px}
  .guide details{border-bottom:1px solid #e3e3e3;padding:10px 0}.guide summary{cursor:pointer;font-weight:600}
  .guide p{margin-top:6px;color:var(--dark);font-size:13px;line-height:1.5}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
  .tabs span{padding:8px 12px;font-size:13px;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0}
  .tabs span.on{background:#fff;border-color:var(--line);margin-bottom:-1px}
  /* landing */
  .land header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid var(--line)}
  .land nav{display:flex;gap:18px;font-size:13px;color:var(--dark)}
  .land .hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:50px 32px;align-items:center;max-width:1100px;margin:0 auto}
  .land .hero h1{font-size:30px;line-height:1.2;margin-bottom:12px}
  .land .sec{max-width:1100px;margin:0 auto;padding:30px 32px}
  .land .sec > h2{font-size:20px;margin-bottom:14px}
  .land footer{padding:24px 32px;text-align:center;font-size:12px;color:var(--dark);border-top:1px solid var(--line);background:#fff}
  .login{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px}
  .login .box{width:360px;display:flex;flex-direction:column;gap:10px;padding:26px}
  /* mapa */
  .mapbar{position:sticky;top:0;z-index:6;background:var(--ink);color:#fff;padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
  .mapbar button{background:#444;color:#fff;border:0;border-radius:3px;padding:5px 9px;font-size:12px;cursor:pointer}
  .mapbar button.on{background:#fff;color:var(--ink)}
  .mapbar .leg{margin-left:auto;display:flex;gap:10px;align-items:center}
  .mapbar .top{position:static}
  body.inapp .top{top:40px}
  .modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:20px;z-index:10}
  .modalbg .box{width:480px;max-height:90vh;overflow:auto}
  @media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid4,.grid3{grid-template-columns:1fr 1fr}.grid2,.form,.kanban,.land .hero{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="mapbar">
  <button data-go="landing">Página institucional</button>
  <button data-go="login">Login</button>
  <button data-go="dash" class="on">Sistema (entrar)</button>
  <span class="leg"><span><span class="tag mvp">MVP</span>teste em 3 dias</span><span><span class="tag v2">V2</span>depois</span></span>
</div>

<div id="root"></div>

<div class="modalbg" id="modal"><div class="box">
  <h2 id="mtitle">Novo</h2>
  <div class="form" id="mform"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><span class="btn sec" data-close>Cancelar</span><span class="btn" data-close id="msave">Salvar</span></div>
</div></div>

const TITLES = {dash:"Dashboard",agenda:"Agendamentos",tarefas:"Tarefas da oficina",relatorios:"Relatórios",analises:"Análises",config:"Configurações",guia:"Guia de uso",cliente:"Ficha do cliente",osd:"Ordem de serviço"};
const STAGE = {dash:"mvp",agenda:"v2",tarefas:"v2",relatorios:"v2",analises:"v2",config:"mvp",guia:"v2",cliente:"mvp",osd:"mvp"};
const navName = id => L[id]?L[id].nav:TITLES[id];

const esc = v => typeof v==="string" && v[0]==="§" ? `<span class="badge">${v.slice(1)}</span>` : v;
const note = (id,t) => `<div class="note"><span class="tag ${STAGE[id]||L[id].st}">${(STAGE[id]||L[id].st).toUpperCase()}</span>${t}</div>`;
const table = (c,r,go) => `<div class="scroll"><table><tr>${c.map(x=>`<th>${x}</th>`).join("")}<th></th></tr>${r.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join("")}<td><div class="acts">${go?`<span class="ico" data-go="${go}">ver</span>`:""}<span class="ico">edit</span><span class="ico">del</span></div></td></tr>`).join("")}</table></div>`;
const bars = (vals,labs) => `<div class="bars">${vals.map(v=>`<div style="height:${v}%"></div>`).join("")}</div><div class="blabels">${labs.map(l=>`<span>${l}</span>`).join("")}</div>`;

function listPage(id){

  <div style="font-size:11px;color:#888;margin:16px 10px 0">Sair</div></aside>`;
}
function appPage(id,navActive){
  const body = L[id]?listPage(id):CUSTOM[id]();
  return `<section class="page" id="${id}"><div class="app">${side(navActive||id)}<div class="main">
   <div class="top"><div class="input">Buscar cliente, placa, OS…</div><div class="r"><span class="ico">notif.</span><span class="ico">tema</span><div class="ph" style="width:30px;height:30px;border-radius:50%">U</div></div></div>
   <div class="content">${body}</div></div></div></section>`;
}

function go(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));
  const grp = id==="landing"?"landing":id==="login"?"login":"dash";
  document.querySelectorAll(".mapbar button").forEach(b=>b.classList.toggle("on",b.dataset.go===grp));
  document.body.classList.toggle("inapp",grp==="dash");
  window.scrollTo(0,0);
}
function openModal(id){
  const f = (L[id]&&L[id].fields) || MODALS[id] || ["Campo 1","Campo 2"];
  const title = L[id]?L[id].btn:(id==="agenda"?"Novo agendamento":"Nova tarefa");
  document.getElementById("mtitle").textContent = title;
  document.getElementById("msave").textContent = "Salvar";
  document.getElementById("mform").innerHTML = f.map(x=>`<div class="${f.length%2&&x===f[f.length-1]?"full":""}"><label>${x.replace(" ▾","")}</label><div class="input">${x.includes("▾")?"Selecione ▾":""}&nbsp;</div></div>`).join("");
  document.getElementById("modal").style.display="flex";
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();go(g.dataset.go);return}
  const m=e.target.closest("[data-modal]"); if(m){openModal(m.dataset.modal);return}
  if(e.target.closest("[data-close]")||e.target.id==="modal") document.getElementById("modal").style.display="none";
});
go("dash");
</script>
